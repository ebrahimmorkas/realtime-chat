name: realtime-chat

x-chat: &chat
  build: .
  image: realtime-chat
  mem_limit: 512m
  environment:
    MONGODB_URI: mongodb://mongo:27017/chat
    REDIS_HOST: redis
    # Demo value only. Generate a real key with: openssl rand -base64 32
    JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Two instances to demonstrate horizontal scaling. Direct ports are for debugging;
  # clients normally go through the load balancer on 8080.
  chat-1:
    <<: *chat
    ports:
      - "8081:8080"

  chat-2:
    <<: *chat
    ports:
      - "8082:8080"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-1
      - chat-2

volumes:
  mongo-data:
